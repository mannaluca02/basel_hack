<!doctype html>
<!--
  DEMO — test page for Paxi's conversation behaviour. In the app, the Angular voice
  service uses paxi-voice.js the same way; this page only adds a test UI around it.
-->
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paxi Demo</title>
<link rel="icon" href="data:," />
<script>document.documentElement.classList.add(new URLSearchParams(location.search).get("intro") === "0" ? "intro-skipped" : "intro-pending");</script>
<style>
  :root { --purple: #360573; --green: #9acb41; --bg: #f5f3f8; --text: #1d1530; --muted: rgba(29,21,48,.6); --line: rgba(127,127,127,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 1fr 360px; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; height: auto; } }
  #stage { display: grid; place-items: center; align-content: center; gap: 12px; padding: 24px 16px; position: relative; }
  #avatar { width: min(60vmin, 440px); cursor: pointer; border: 0; background: none; padding: 0; }
  #avatar:disabled { cursor: default; }
  #hint { font-size: 15px; color: var(--muted); text-align: center; min-height: 1.4em; }
  #caption { max-width: 560px; text-align: center; font-size: 17px; line-height: 1.45; min-height: 3em; }
  #stop { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: inherit; cursor: pointer; }
  #stop[hidden] { display: block; visibility: hidden; }
  aside { border-left: 1px solid var(--line); padding: 20px 16px; overflow-y: auto; font-size: 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
  h2:first-child { margin-top: 0; }
  #status, #face { color: var(--muted); }
  #transcript { display: flex; flex-direction: column; gap: 6px; }
  .turn { max-width: 90%; padding: 6px 10px; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; }
  .turn.agent { background: #fff; border: 1px solid var(--line); align-self: flex-start; }
  .turn.user { background: var(--purple); color: #fff; align-self: flex-end; }
  #answers h3 { font-size: 12px; font-weight: 600; margin: 12px 0 6px; color: var(--muted); }
  .answer { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .answer.priority { border-color: var(--purple); box-shadow: inset 4px 0 0 var(--purple); }
  .answer { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .answer .label { font-size: 12px; color: var(--muted); }
  .answer.captured { border-color: var(--green); box-shadow: inset 4px 0 0 var(--green); }
  .answer.declined { border-color: #e0a100; box-shadow: inset 4px 0 0 #e0a100; }
  .answer.declined .value { font-weight: 400; font-style: italic; }
  .answer .value { font-weight: 600; min-height: 1.2em; }
  a { color: var(--purple); }
  .intro-pending { overflow: hidden; }
  .intro-pending #stage, .intro-pending aside { visibility: hidden; }
  .intro-pending #avatar { opacity: 0; }
  #intro { position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%; border: 0; padding: 0; background: var(--purple); cursor: pointer; display: grid; place-items: center; overflow: hidden; }
  #intro:disabled { cursor: default; }
  #intro:focus-visible { outline: 4px solid #9bd509; outline-offset: -10px; }
  #intro-logo { width: min(70vw, 520px); height: auto; overflow: visible; transform-origin: 0 0; }
  #intro-dot { animation: dot-invite 2.8s ease-in-out infinite; }
  #intro-morph { position: fixed; background: #fff; pointer-events: none; transform-origin: 0 0; }
  #intro-morph::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(ellipse at 35% 28%, #9bd509, #8bcb00 45%, #62a600); opacity: 0; }
  .intro-landing #intro-morph::after { opacity: 1; transition: opacity 500ms ease; }
  .intro-running #intro-dot { animation: none; visibility: hidden; }
  .intro-skipped #intro { display: none; }
  @keyframes dot-invite { 50% { filter: drop-shadow(0 0 5px #ffffff80); opacity: .72; } }
  @media (prefers-reduced-motion: reduce) { #intro-dot { animation: none; } }
</style>
</head>
<body>
<button id="intro" type="button" aria-label="Mit Paxi sprechen" disabled>
<svg id="intro-logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454.099 152.662"><path id="intro-letters" fill="#8ccd0f" d="m313.288 144.806 44.794-58.06-44.365-57.495h43.368l25.82 34.954 26.11-34.954h38.802L403.309 86.46l45.79 58.347h-44.936l-25.391-33.952-25.968 33.952zm-43.082-35.092V92.31c-4.992.71-9.416 1.425-22.111 3.566-13.41 2.283-17.835 7.418-17.835 13.84 0 7.131 3.995 12.266 14.269 12.266 7.704 0 18.402-5.278 25.677-12.267m4.99 35.092-2.712-11.842c-12.266 9.988-23.965 14.698-39.368 14.698-22.974 0-39.092-13.124-39.092-34.382 0-21.543 14.55-33.528 43.94-38.09 16.69-2.57 25.11-3.853 31.383-4.563V66.77c0-10.412-5.277-15.122-17.114-15.122-13.13 0-17.835 5.282-18.407 14.126h-34.81c2.569-29.529 24.966-39.373 55.782-39.373 37.518 0 50.786 16.118 50.786 47.787v39.092c0 12.839.286 18.545 3.137 31.526zM125.69 73.478c17.978 0 24.251-7.418 24.251-19.975 0-12.553-6.273-19.97-24.251-19.97h-18.83v39.945zm-56.207 71.328V5h59.344c41.233 0 59.348 20.256 59.348 48.503 0 28.251-18.115 48.507-59.348 48.507h-21.968v42.796H69.482z"/><path id="intro-dot" fill="#fff" d="M5 104.29h39.373v40.517H5z"/></svg>
</button>
<main id="stage" inert>
  <button id="avatar" aria-label="Gespräch mit Paxi starten"></button>
  <div id="hint">Tippe auf Paxi, um das Gespräch zu starten.</div>
  <div id="caption"></div>
  <button id="stop" hidden>Gespräch beenden</button>
</main>
<aside inert>
  <h2>Status</h2>
  <div id="status">Bereit.</div>
  <div id="face"></div>
  <a id="download" hidden target="_blank">Gesprächslog (JSON)</a>
  <h2 id="questionnaire-title">Fragebogen</h2>
  <div id="answers"></div>
  <h2>Gespräch</h2>
  <div id="transcript"></div>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
