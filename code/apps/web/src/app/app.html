<header class="bar">
  <span class="brand">{{ 'app.name' | transloco }}</span>
  <app-language-switcher />
</header>

<main class="view" #view>
  <router-outlet />
</main>

<div class="rail">
  <nav class="tabs" [attr.aria-label]="'nav.label' | transloco">
    @for (tab of tabs; track tab.id) {
      @let badge = tab.id === 'risks' ? openRisks() : 0;
      <a
        class="tab"
        [routerLink]="tab.path"
        routerLinkActive="tab--active"
        ariaCurrentWhenActive="page"
      >
        <span class="glyph">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path [attr.d]="tab.icon" />
          </svg>
          @if (badge > 0) {
            <span class="badge" aria-hidden="true">{{ badge > 99 ? '99+' : badge }}</span>
          }
        </span>
        <span class="label">{{ tab.label | transloco }}</span>
        @if (badge > 0) {
          <span class="visually-hidden">{{ 'nav.openRisks' | transloco: { count: badge } }}</span>
        }
      </a>
    }
  </nav>

  <!-- Reserved slot for the agent with its progress ring (FE-09); tapping it opens the summary. -->
  <div class="dock" aria-hidden="true"></div>
</div>
