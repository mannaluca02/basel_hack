<!doctype html>
<!--
  PROTOTYPE — throwaway. Live test: OpenAI Realtime voice driving the Pax avatar.
  Run: node code/avatar-prototype/server.mjs  →  http://localhost:8787/realtime.html
  Wiring: openai-realtime-adapter.js (voice, Dario) → AvatarEvents → pax-avatar.js (avatar, Lukas)
-->
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Pax Avatar × OpenAI Realtime</title>
<link rel="stylesheet" href="avatar-prototype.css" />
</head>
<body>
<main id="stage">
  <div id="caption">PROTOTYPE · Pax Avatar × OpenAI Realtime</div>
  <div id="avatar"></div>
  <div id="say"></div>
</main>

<aside id="panel">
  <h3>Verbindung</h3>
  <div class="grid">
    <button class="wide" id="btnConnect">🎙 Gespräch starten</button>
  </div>
  <div style="margin-top:8px" class="meter"><div id="meter"></div></div>

  <h3>Test: Emotion auslösen</h3>
  <div class="grid" id="emotions"></div>

  <h3>Zustand</h3>
  <pre id="state"></pre>

  <h3>AvatarEvents</h3>
  <pre id="log"></pre>
</aside>

<audio id="remote" autoplay></audio>
<script type="module">
import { createPaxAvatar, EMOTIONS } from "./pax-avatar.js";
import { connectOpenAIRealtime } from "./openai-realtime-adapter.js";

const $ = (id) => document.getElementById(id);
let connection = "idle", call = null, lastReply = null;

const avatar = createPaxAvatar($("avatar"));
setInterval(() => {
  const { level } = avatar.state;
  $("meter").style.width = (level * 100).toFixed(0) + "%";
  const s = avatar.state;
  document.querySelectorAll("[data-emo]").forEach((b) => b.classList.toggle("on", b.dataset.emo === s.face));
  $("state").textContent = `connection ${connection}\nface       ${s.face}\nactivity   ${s.activity}\nplaying    ${s.playing ?? "–"}\nreply      ${s.replyEmotion}`;
}, 100);

// Test buttons: sent as AvatarEvents through the controller, the same path the voice adapter uses.
// Reply emotions are queued while listening/thinking and stabilised during a reply,
// so the test resets the controller first to show each emotion immediately.
for (const key in EMOTIONS) {
  const ev = key === "listening" || key === "thinking" ? { type: "activity", state: key } : { type: "emotion", emotion: key };
  const b = document.createElement("button");
  b.textContent = EMOTIONS[key].label; b.dataset.emo = key;
  b.onclick = () => { avatar.reset(); log(`${avatar.handle(ev) ? "" : "(ignored) "}test ${JSON.stringify(ev)}`); };
  $("emotions").appendChild(b);
}

function log(line) {
  $("log").textContent = `${new Date().toLocaleTimeString()}  ${line}\n` + $("log").textContent.slice(0, 6000);
}

$("btnConnect").onclick = async () => {
  if (call) { call.close(); call = null; connection = "closed"; $("btnConnect").textContent = "🎙 Gespräch starten"; return; }
  connection = "connecting";
  try {
    call = await connectOpenAIRealtime({
      sessionUrl: "/session",
      audioElement: $("remote"),
      onAudioStream: (stream) => avatar.attachAudio(stream),
      onAvatarEvent: (ev) => {
        const used = avatar.handle(ev);
        log(`${used ? "" : "(ignored) "}${JSON.stringify(ev)}`);
      },
      onTranscript: (delta, replyId) => {
        if (replyId !== lastReply) { lastReply = replyId; $("say").textContent = ""; }
        $("say").textContent += delta;
      },
      onLog: log,
    });
    connection = "connected";
    $("btnConnect").textContent = "⏹ Gespräch beenden";
  } catch (err) {
    connection = "error"; log(`ERROR ${err.message}`);
  }
};
</script>
</body>
</html>
