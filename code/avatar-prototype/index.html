<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: what should the Pax Beratercharakter look like?
  A square mascot in the spirit of the ChatGPT voice dot: eyes only, no mouth.
  Emotions come from the conversation, speech is shown by squash & stretch driven by audio level.
  Design: "Soft Block". ?emotion=<key> sets the start emotion. Rig lives in pax-avatar.js.
  Open this file directly in a browser. No build, no server. Live voice: see realtime.html.
-->
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · Pax Beratercharakter</title>
<link rel="stylesheet" href="avatar-prototype.css" />
</head>
<body>
<main id="stage">
  <div id="caption">PROTOTYPE · Pax Beratercharakter</div>
  <div id="avatar"></div>
  <div id="say"></div>
</main>

<aside id="panel">
  <h3>Emotion</h3>
  <div class="grid" id="emotions"></div>

  <h3>Sprechen (Audio → Squash & Stretch)</h3>
  <div class="grid">
    <button id="btnSim">Sprache simulieren</button>
    <button id="btnMic">Mikrofon nutzen</button>
  </div>
  <div style="margin-top:8px" class="meter"><div id="meter"></div></div>

  <h3>Gesprächs-Demo</h3>
  <div class="grid"><button class="wide" id="btnScript">▶ Beratung abspielen</button></div>

  <h3>Zustand</h3>
  <pre id="state"></pre>
</aside>

<script src="pax-avatar.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let source = "none";      // none | sim | mic

const avatar = PaxAvatar.mount($("avatar"), { onFrame: ({ emotion, level, cur, body }) => {
  $("meter").style.width = (level * 100).toFixed(0) + "%";
  $("state").textContent =
    `emotion   ${emotion}\naudio     ${source}  level ${level.toFixed(2)}\n` +
    `eyes      gaze ${cur.gx.toFixed(2)},${cur.gy.toFixed(2)} open ${cur.open.toFixed(2)}\n` +
    `          lid ${cur.lidA.toFixed(1)}° drop ${cur.lidD.toFixed(2)} smile ${cur.smile.toFixed(2)}\n` +
    `body      sx ${body.sx.toFixed(3)} sy ${body.sy.toFixed(3)} rot ${body.rot.toFixed(1)}° ty ${body.ty.toFixed(1)}`;
} });

// ---------- Emotion buttons ----------
for (const key in PaxAvatar.EMOTIONS) {
  const b = document.createElement("button");
  b.textContent = PaxAvatar.EMOTIONS[key].label; b.dataset.emo = key;
  b.onclick = () => setEmotion(key);
  $("emotions").appendChild(b);
}
function setEmotion(key) {
  avatar.setEmotion(key);
  document.querySelectorAll("[data-emo]").forEach((b) => b.classList.toggle("on", b.dataset.emo === avatar.emotion));
}

// ---------- Audio ----------
// Fake speech: syllables at ~5 Hz, words, short pauses
let simT = 0;
function simLevel(dt) {
  simT += dt;
  const phrase = (Math.sin(simT * 0.9) + Math.sin(simT * 2.3 + 1)) > -0.9 ? 1 : 0;
  const syll = Math.max(0, Math.sin(simT * 2 * Math.PI * 4.7)) ** 0.6;
  return phrase * (0.35 + 0.65 * syll) * (0.75 + 0.25 * Math.random());
}
function setSource(next) {
  source = next;
  if (next !== "mic") avatar.setLevelSource(next === "sim" ? simLevel : null);
  $("btnSim").classList.toggle("on", source === "sim"); $("btnMic").classList.toggle("on", source === "mic");
}
$("btnSim").onclick = () => setSource(source === "sim" ? "none" : "sim");
$("btnMic").onclick = async () => {
  if (source === "mic") return setSource("none");
  avatar.attachStream(await navigator.mediaDevices.getUserMedia({ audio: true }));
  setSource("mic");
};

// ---------- Scripted conversation ----------
const SCRIPT = [
  [0,    "happy",       true,  "Grüezi! Ich bin Pax, Ihr digitaler Vorsorge-Berater."],
  [3200, "listening",   false, "(Kunde erzählt von Familie und Job …)"],
  [6400, "thinking",    false, "(Vorsorgebild wird berechnet …)"],
  [8800, "surprised",   true,  "Oh – Sie planen ein Eigenheim? Spannend!"],
  [11200,"concerned",   true,  "Bei Erwerbsunfähigkeit sehe ich eine Vorsorgelücke."],
  [14400,"empathetic",  true,  "Ich verstehe, das Thema Tod ist nicht einfach."],
  [17800,"listening",   false, "(Kunde stellt eine Frage …)"],
  [20200,"happy",       true,  "Mit Säule 3a schliessen wir die Lücke gut."],
  [23400,"celebrating", false, "Antrag abgeschlossen!"],
  [26400,"neutral",     false, ""],
];
let timers = [];
$("btnScript").onclick = () => {
  timers.forEach(clearTimeout); timers = [];
  SCRIPT.forEach(([t, emo, speak, text]) => timers.push(setTimeout(() => {
    setEmotion(emo); $("say").textContent = text;
    if (source !== "mic") setSource(speak ? "sim" : "none");
  }, t)));
};

window.pax = avatar;
setEmotion(new URLSearchParams(location.search).get("emotion") || "neutral");
</script>
</body>
</html>
